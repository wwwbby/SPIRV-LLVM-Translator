课题：基于大模型后训练的高性能算子生成创新研究
【背景】随着大模型参数量级跃迁，底层算子（如FlashAttention、量化算子、MoE路由算子）的性能直接决定了训练与推理的效率边界。然而，传统算子开发面临“人工开发周期长”与“硬件特性匹配难（如NPU/GPU的非对齐访问、流水线排布）”的痛点。基于可验证奖励的强化学习（RLVR）在数学、编程等可验证领域展现出巨大潜力。
【挑战】
（1）长时程稳定性训练问题—算子生成通常需要数十甚至上百步的推理链条，包含规划、代码生成、编译验证、错误修正等多个环节。现有RL框架在长时程训练中普遍存在训练不稳定、结果不可复现的问题。
(2) 细粒度信用分配的困境——现有RL方法要么采用粗粒度的轨迹级奖励（如GRPO），无法精确区分算子生成过程中哪一步决策导致了最终成功或失败；
(3) Agentic冷启动难题——算子生成涉及大量领域特定知识（如Triton-Ascend编程模型、硬件架构特性），模型在初始阶段缺乏有效探索方向，极易陷入无效搜索空间
(4) 多Agent协同的复杂性——算子生成天然需要多角色协作：规划者设计算子结构、编写者生成代码、验证者测试正确性、优化者调优性能。现有方法多为单模型“全能型”训练，难以扩展且泛化能力弱。
【对标产品】：TritonForge，Kernel-Smith，Dr. Kernel
